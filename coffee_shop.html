<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Haven</title>
    <style>
        h1 {
            font-family: 'Brush Script MT', cursive;
            font-size: 4rem;
        }
        body {
            background-color: navajowhite;
        }
        ul {
            list-style-type: none;
        }
        .nav > ul > li {
            border-radius: 5px;
            padding: 10px;
            background-color: burlywood;
            border: 2px solid saddlebrown;
        }         
        .nav {
            display: grid;
            grid-template-columns: 200px 200px 200px;
        }
        .header,
        .main-content,
        .footer {
            border-radius: 5px;
            padding: 10px;
            background-color: burlywood;
        }
        .flex-container {
            display: flex;
            flex-direction: column;
        }
        .flex-item {
            border-radius: 5px;
            border: 2px solid saddlebrown;
            background-color: navajowhite;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Java Haven</h1>
        <p>Your daily dose of caffeine and comfort.</p>
    </header>

    <nav class="nav">
        <ul>
            <li><a href="#menu">Menu</a></li>
            <li><a href="#about">About Us</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <h2>Featured Coffees</h2>
        <div class="flex-container">
            <div class="flex-item">Espresso</div>
            <div class="flex-item">Cappuccino</div>
            <div class="flex-item">Latte</div>
            <div class="flex-item">Mocha</div>
        </div>
    </main>
    
    <footer class="footer">
        <p>&copy; 2025 Java Haven. All Rights Reserved.</p>
    </footer>
    </body>
</html>
